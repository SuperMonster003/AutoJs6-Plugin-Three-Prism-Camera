name: Build integrity

# Roadmap P0.4: only pushes to master and pull requests run the build by default, plus manual runs.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    name: Repository checks, unit tests and APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # check_repository.py compares VERSION_BUILD with the full commit count.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify the repository contract and generated documents
        run: |
          python .python/check_repository.py
          python .python/generate_markdown.py --check
          python -m py_compile .python/device_smoke.py .python/ci_connected_tests.py .python/release_sums.py

      - name: Run unit tests, assemble APKs and lint
        run: |
          chmod +x gradlew
          # The release APKs are built explicitly: R8 and resource shrinking failures only surface there. They stay unsigned
          # on CI; the signed collection task (appendDigestToReleasedFiles) and device_smoke.py run locally.
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:lintDebug -Pautojs.gradle.build.number.auto.increment.enabled=false -Pautojs.gradle.build.time.update.enabled=false --console=plain --stacktrace

      # Roadmap D22, appendix D Q8 = (b): one release APK per ABI plus the universal APK, each carrying exactly the
      # CameraX and Compose helpers of its ABIs, stored, ELF PT_LOAD and zip data offset 16 KB aligned (the rule
      # appendDigestToReleasedFiles enforces locally on the signed APKs).
      - name: Check the release artifacts
        run: python .python/release_sums.py --artifacts app/build/outputs/apk/release

      - name: Upload debug, release and test APKs
        uses: actions/upload-artifact@v7
        with:
          name: three-prism-camera-apks
          path: app/build/outputs/apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload test and lint reports after failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Skeleton of the emulator job (roadmap D35, P0.4): the activation, discovery and Binder contract and the CameraX
  # placeholder (CameraSmokeTest) run now; roadmap P4.1 adds the session, frame and capture cases on the same image.
  connected-avd:
    name: Contract and camera tests (API 33, x86_64)
    needs: verify-build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the contract tests and the CameraX smoke test
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: Three_Prism_Camera_CI_33
          # Two emulated cameras give CameraX a back and a front camera (roadmap D35). The virtual scene back camera of the
          # API 33 image stamps every frame with the same negative timestamp and cameraserver drops them all (appendix D Q54).
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          # ci_connected_tests.py turns the animations off (and hides system error dialogs) once the emulator settled.
          disable-animations: false
          # The emulator runner executes every script line as a separate shell command, so a backslash continuation would
          # become a literal Gradle task name; keep each command on one line (3-Block Compose lesson).
          script: |
            chmod +x gradlew
            python3 .python/ci_connected_tests.py

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-reports-api33
          path: |
            app/build/reports/androidTests/
            app/build/reports/androidTests-attempt-1/
            app/build/outputs/androidTest-results/connected/
            app/build/outputs/androidTest-results/connected-attempt-1/
          if-no-files-found: ignore
          retention-days: 7
