[versions]

# Jetpack CameraX (roadmap D21, maintainer decision Q3 = (b) of 2026-11-05): the stable 1.6.2 line for camera-core,
# camera-camera2, camera-lifecycle and camera-compose (CameraXViewfinder); 1.7.0 release candidates are not used.
camerax = "1.6.2"
# Compose 1.12 line (compileSdk 37, AGP 9.1.1+), the same BOM as 3-Macaw Speech, 3-Maple Image and 3-Block Compose (roadmap D41).
compose-bom = "2026.09.00"
# The Compose BOM does not manage androidx.activity; this is the activity line 3-Macaw Speech ships with the same BOM.
activity-compose = "1.12.2"
# CameraX 1.6.2 and activity 1.12.2 resolve androidx.core 1.16.0, so the declared version is the packaged one.
core-ktx = "1.16.0"
# The capture writes its EXIF orientation itself (roadmap appendix D Q13 / Q14 = (b)); 1.4.2 is the version CameraX 1.6.2
# already resolves, so declaring it changes nothing in the APK.
exifinterface = "1.4.2"
foojay-resolver-convention = "1.0.0"
junit = "4.13.2"
# The real org.json for the JVM tests of the update check (android.jar only has stubs); the version 3-Macaw Speech and the
# host test with.
org-json = "20231013"
# The MIT Kotlin port of Material Color Utilities that 3-Macaw Speech and 3-Block Compose ship: the fixed HCT tone rule of the
# standalone settings specification (section 6) for the theme accent of the plugin's screens (roadmap P3.2).
material-color-utilities = "4.1.1"
# The test library line of 3-Macaw Speech: Espresso 3.5.0 calls InputManager.getInstance, gone on API 36.
test-espresso-core = "3.7.0"
test-junit-version = "1.3.0"
test-rules = "1.7.0"
test-runner = "1.7.0"

[libraries]

camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-compose = { module = "androidx.camera:camera-compose", version.ref = "camerax" }
camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
compose-activity = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
junit = { module = "junit:junit", version.ref = "junit" }
org-json = { module = "org.json:json", version.ref = "org-json" }
material-color-utilities = { module = "com.materialkolor:material-color-utilities", version.ref = "material-color-utilities" }
test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "test-espresso-core" }
test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "test-junit-version" }
test-rules = { module = "androidx.test:rules", version.ref = "test-rules" }
test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }

[plugins]

foojay-resolver-convention = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay-resolver-convention" }
